<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>SQLiDemo | Login</title>
	<style>
		/* Color and image properties chosen to match regis.html styling */
		body {
			margin: 0;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background-image: url('images/regbgg2.jpeg');
			min-height: 100vh;
            background-size: cover;
            background-position: center;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.card {
			width: 100%;
            max-width: 400px;
			background-color: transparent;
			border-radius: 12px;
			box-shadow:
                -30px 0 60px rgba(0, 0, 0, 0.25),
                30px 0 60px rgba(0, 0, 0, 0.25),
                0 -30px 60px rgba(0, 0, 0, 0.25),
                0 30px 60px rgba(0, 0, 0, 0.25),
                0 10px 80px rgba(0, 0, 0, 0.25);
			overflow: hidden;
			text-align: center;
		}
        .form-title {
            text-align: center;
            color: #e4e1e1;
            font-size: 30px;
            margin-top: 30px;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .form-title-subtitle {
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }
        .form-title-subtitle::before,
        .form-title-subtitle::after {
            content: "";
            height: 1px;
            flex: 1;
            background-color: currentColor;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #fcf9f9;
            font-weight: 500;
            font-size: 14px;
        }
		.content {
			padding: 24px;
		}
		h2 { margin: 0 0 12px; color: #222; }
		.input-group { margin-bottom: 14px; text-align: left; }
		
		input[type="email"],
        input[type="password"],
        select {
            width: 315px;
            padding: 10px 12px;
            border: 2px solid #fcf9f9;
            border-radius: 5px;
            font-size: 14px;
            color: #fcf9f9;
            background-color: transparent;
            transition: all 0.3s ease;
        }
        input[type="email"]:focus,
        input[type="password"]:focus,
        select:focus {
            outline: none;
            border-color: #2b2b2a;
            box-shadow: 0 0 5px rgba(139, 111, 71, 0.3);
        }
        input::placeholder {
            color: #fcf9f9;
            opacity: 1;
        }
        input:focus::placeholder {
            color: transparent;
        }
        .choice-group {
            display: flex;
            gap: 18px;
            align-items: center;
            justify-content: center;
            margin: 18px 0 10px;
            padding: 10px 12px;
            border: 1.5px solid rgba(73, 40, 12, 0.5);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
        }
        .radio-option {
            display: inline-flex;
            align-items: center;
			margin-right: 20px;
			margin-left: 20px;
            gap: 8px;
            color: #fcf9f9;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .radio-option input[type="radio"] {
            accent-color: #2b2b2a;
            width: 15px;
            height: 15px;
            margin: 0;
            cursor: pointer;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
		.btn {
			display: inline-block;
			width: 100%;
			padding: 10px 12px;
			background: #2b2b2d;
			color: #fff;
			border: none;
			border-radius: 8px;
			font-size: 16px;
            font-weight: 600;
			cursor: pointer;
			margin-top: 6px;
		}
        .btn:hover {
            background-color: #19191c;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(107, 68, 35, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
		.foot { margin-top: 12px; font-size: 14px; color: #fcf9f9; }
		.small { font-size: 13px; color: #fcf9f9; margin-top:8px }
        .small a { color: #fcf9f9; text-decoration: none; font-weight: 600; }
        .small a:hover {
            text-decoration: underline;
        }
		.site-logo{
            position:absolute;
            top:25px;
            left:30px;
            color:white;
            text-decoration:none;
            font-size:22px;
            z-index:1000;
        }
        .site-logo:hover{
            opacity:0.8;
        }
	</style>
</head>
<body>
<a th:href="@{/}" class="site-logo">SQLiDemo</a>
	<div class="card">
		<div class="content">
            <h2 class="form-title">Welcome Back<br><span class="form-title-subtitle">Sign in to continue</span></h2>
            <form th:action="@{/login}" method="post" novalidate>
				<div class="input-group">
					<label for="email">Email ID</label>
					<input id="email" name="email" type="email" placeholder="you@example.com" required />
				</div>
				<div class="input-group">
					<label for="password">Password</label>
					<input id="password" name="password" type="password" placeholder="Enter your password" required />
				</div>
                <div class="choice-group" role="radiogroup" aria-label="Security preference">
                    <label class="radio-option">
                        <input type="radio" name="mode" value="secure" checked />
                        <span>Secure</span>
                    </label>
					<label class="radio-option">
                        <input type="radio" name="mode" value="vulnerable" />
                        <span>Vulnerable</span>
                    </label>
                </div>
                <div class="button-group">
                    <button class="btn" type="submit">Login</button>
                </div>
			</form>
            <div class="small">Don't have an account? <a th:href="@{/register}">Register</a></div>
		</div>
	</div>
</body>
</html>

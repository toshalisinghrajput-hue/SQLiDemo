<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLiDemo | Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('images/regbgg2.jpeg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background-color: transparent;
            padding: 40px;
            border-radius: 10px;
            opacity: 85%;
            /* enhanced shadow for stronger depth and contrast */
            box-shadow:
                -30px 0 60px rgba(0, 0, 0, 0.25),
                30px 0 60px rgba(0, 0, 0, 0.25),
                0 -30px 60px rgba(0, 0, 0, 0.25),
                0 30px 60px rgba(0, 0, 0, 0.25),
                0 10px 80px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 500px;
        }
        .form-title {
            text-align: center;
            color: #fcf9f9;
            font-size: 25px;
            margin-top: 30px;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .registration-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .registration-title::before,
        .registration-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #fcf9f9;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #fcf9f9;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 3px solid #fcf9f9;
            border-radius: 5px;
            font-size: 14px;
            color: #f4efef;
            background-color: transparent;
            transition: all 0.3s ease;
        }
        input::placeholder {
            color: #fcf9f9;
            opacity: 1;
        }
        input:focus::placeholder {
            color: transparent;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        select:focus {
            outline: none;
            border-color: #2b2b2a;
            box-shadow: 0 0 5px rgba(139, 111, 71, 0.3);
        }
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B4423' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px;
            padding-right: 40px;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-register {
            background-color: #2b2b2d;
            color: #edebe8;
        }
        .btn-register:hover {
            background-color: #19191c;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(86, 85, 84, 0.3);
        }
        .btn-register:active {
            transform: translateY(0);
        }
        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: #fcf9f9;
            font-size: 13px;
        }
        .form-footer a {
            color: #fcf9f9;
            text-decoration: none;
            font-weight: 600;
        }
        .form-footer a:hover {
            text-decoration: underline;
        }
        .site-logo{
            position:absolute;
            top:25px;
            left:30px;
            color:white;
            text-decoration:none;
            font-size:22px;
            z-index:1000;
        }
        .site-logo:hover{
            opacity:0.8;
        }

    </style>
</head>
<body>
<a th:href="@{/}" class="site-logo">SQLiDemo</a>
<div class="container">
    <h1 class="form-title">Welcome to the SQLi Demo Lab<br><span class="registration-title">Registration</span></h1>
    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="Enter your email address" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" placeholder="Enter your password" required>
        </div>
        <div class="button-group">
            <button type="submit" class="btn btn-register">Register</button>
        </div>
    </form>
    <p class="form-footer">
        Already have an account? <a th:href="@{/login}">Sign in here</a>
    </p>
</div>
</body>
</html>
